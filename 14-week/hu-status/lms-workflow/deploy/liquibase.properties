# Read by workflow-migrate (deploy/compose.yml). Connection URL/username/
# password are set via LIQUIBASE_COMMAND_URL/USERNAME/PASSWORD in
# compose.yml (Liquibase's own ${VAR} substitution inside this file does not
# work — confirmed directly in every other -db repo).
#
# changeLogTableName/changeLogLockTableName suffixed per domain — one shared
# database means two domains' migration-tracking tables would otherwise
# collide on the default name (rules/3-Anexo-J, J.6).
changelogFile=migrations/changelog.yaml
databaseChangeLogTableName=databasechangelog_workflow
databaseChangeLogLockTableName=databasechangeloglock_workflow
