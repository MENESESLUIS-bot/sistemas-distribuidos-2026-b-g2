# Security gates proposed for the LMS-Library Go services (lms-catalog-api first).
# Runs on every pull request; any red step blocks the merge.
#   1. gitleaks       - no secret (INTERNAL_JWT_SECRET, DB_PASSWORD, JWT keys) committed
#   2. govulncheck    - known vulnerabilities in the Go dependencies actually called
#                       (needs Go 1.26.9: on 1.25.1 it finds 8 reachable stdlib issues)
#   3. authz tests    - negative authorization tests of the [security] story for
#                       STRIDE row E (PR #36): wrong token on a route -> 403
name: security

on:
  pull_request:
    branches: [develop, qa, main]
  workflow_dispatch:

permissions:
  contents: read

env:
  SERVICE_DIR: 13-week/workshop/04-security-ci/lms-catalog-api

jobs:
  secrets:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan the PR commits for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependencies:
    name: govulncheck (dependency audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.9"
          cache-dependency-path: ${{ env.SERVICE_DIR }}/go.sum
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
      - name: Audit lms-catalog-api dependencies
        working-directory: ${{ env.SERVICE_DIR }}
        run: govulncheck ./...

  authz:
    name: negative authorization tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.9"
          cache-dependency-path: ${{ env.SERVICE_DIR }}/go.sum
      - name: Wrong token on a /api/v1/books route must answer 403
        working-directory: ${{ env.SERVICE_DIR }}
        run: go test ./internal/httpapi/ -run 'Cannot|401|RightToken' -v
